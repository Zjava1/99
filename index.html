<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Realistic 3D Gift Box</title>
  <style>
    body {
      margin: 0;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      perspective: 1200px;
    }

    .box-scene {
      transform: rotateY(-15deg) rotateX(10deg);
      transform-style: preserve-3d;
      width: 300px;
      height: 200px;
      position: relative;
    }

    .box-base, .box-lid {
      width: 100%;
      height: 100%;
      position: absolute;
      border-radius: 10px;
      transform-style: preserve-3d;
    }

    .box-base {
      background: linear-gradient(145deg, #5a4a42, #3e322c);
      box-shadow: 0 20px 30px rgba(0,0,0,0.3);
      z-index: 1;
    }

    .box-lid {
      background: linear-gradient(to bottom right, #ffe6eb, #ffc4d0);
      z-index: 2;
      cursor: pointer;
      transition: transform 1s ease-in-out;
      transform-origin: top center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      font-family: 'Arial', sans-serif;
      color: #111;
    }

    .box-lid.open {
      transform: rotateX(-140deg) translateZ(5px);
    }

    .hearts {
      color: red;
      font-size: 20px;
      margin-bottom: 5px;
    }

    .title {
      font-size: 20px;
      font-weight: bold;
      margin: 2px 0;
      text-align: center;
    }

    .subtitle {
      font-size: 16px;
      font-style: italic;
      margin-top: 4px;
    }

    .cards-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transition: opacity 1s ease-in-out;
      z-index: 3;
    }

    .card {
      background: #fff;
      border-radius: 8px;
      padding: 20px;
      margin: 10px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
      display: block;
      font-size: 18px;
      font-family: 'Arial', sans-serif;
      color: #333;
      text-align: center;
    }

    .card-button {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      width: 100%;
    }

    .card-button button {
      background-color: #ffc4d0;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
    }

    .card-button button:hover {
      background-color: #ff8f9e;
    }

  </style>
</head>
<body>
  <div class="box-scene">
    <div class="box-base"></div>
    <div class="box-lid" id="lid">
      <div class="hearts">❤️ ❤️ ❤️</div>
      <div class="title">99 reasons<br>WHY</div>
      <div class="subtitle">I love you</div>
      <div class="hearts">❤️ ❤️ ❤️</div>
    </div>
    <div class="cards-container" id="cards-container">
      <!-- Cards will be dynamically inserted here -->
    </div>
  </div>

  <script>
    const lid = document.getElementById('lid');
    const cardsContainer = document.getElementById('cards-container');
    const reasons = [
      "You make my world brighter.",
      "I love the way you laugh.",
      "You're my greatest support.",
      "You make me feel special everyy dayyy.",
      "You're sooo cuteeee.",
      "You're my safe place.",
      "You're the best listener.",
      "You always know how to make me smile.",
      "You believe in me even when I don't.",
      "You’re my favorite person to spend time with.",
      // ... the rest of the reasons
    ];

    let currentCardIndex = 0;

    lid.addEventListener('click', () => {
      lid.classList.toggle('open');
      cardsContainer.style.opacity = 1;
      showCard(currentCardIndex);
    });

    function showCard(index) {
      // Clear the container before adding a new card
      cardsContainer.innerHTML = '';

      const card = document.createElement('div');
      card.classList.add('card');
      card.innerText = reasons[index];
      cardsContainer.appendChild(card);

      const cardButtons = document.createElement('div');
      cardButtons.classList.add('card-button');
      cardButtons.innerHTML = `
        <button onclick="prevCard()">Back</button>
        <button onclick="nextCard()">Next</button>
      `;
      card.appendChild(cardButtons);
    }

    function nextCard() {
      if (currentCardIndex < reasons.length - 1) {
        currentCardIndex++;
        showCard(currentCardIndex);
      }
    }

    function prevCard() {
      if (currentCardIndex > 0) {
        currentCardIndex--;
        showCard(currentCardIndex);
      }
    }
  </script>
</body>
</html>
